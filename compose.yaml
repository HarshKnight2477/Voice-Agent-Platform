# Local development services. Start: docker compose up -d   Stop: docker compose down
# Values come from .env (copy .env.example). Ports bind to 127.0.0.1 only, never to the network.
# LiveKit SIP (phone calls) is added with phone numbers.

name: voice-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  livekit:
    # Local development media server. --dev uses the public dev keys (devkey / secret):
    # never expose this to a network. --node-ip makes WebRTC reachable from this PC's browser.
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"       # signalling / API
      - "127.0.0.1:7881:7881"       # WebRTC over TCP
      - "127.0.0.1:7882:7882/udp"   # WebRTC over UDP

  # ---- Free local speech (optional): docker compose --profile speech up -d ----
  stt:
    # Whisper speech-to-text (faster-whisper) behind an OpenAI-compatible API, on the CPU so
    # the GPU stays free for the local LLM.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["speech"]
    restart: unless-stopped
    environment:
      WHISPER__TTL: "-1"            # keep the model loaded (no reload delay mid-call)
      WHISPER__COMPUTE_TYPE: int8   # fastest on CPU
      WHISPER__CPU_THREADS: "8"
      _UNSTABLE_VAD_FILTER: "false" # LiveKit's VAD already trims silence
      ENABLE_UI: "false"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub

  tts:
    # Kokoro text-to-speech behind an OpenAI-compatible API (CPU build).
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["speech"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"

volumes:
  stt-models:
  postgres-data:
  redis-data:
