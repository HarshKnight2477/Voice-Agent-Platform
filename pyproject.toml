[project]
name = "voice-platform"
version = "0.1.0"
description = "Multi-tenant AI voice agent platform (control plane, agent worker, background jobs)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "tzdata>=2026.6",
    "anthropic>=1.0",
    "livekit-api>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the local Docker services (PostgreSQL, Redis)",
    "live_llm: calls the real LLM API (needs an API key; costs money)",
]
addopts = "-m 'not live_llm'"
# The local LiveKit dev server uses the public 6-character dev secret; production rejects it.
filterwarnings = ["ignore:The HMAC key is 6 bytes long:jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "voice_platform.api.dependencies.require"]

[tool.ruff.lint.per-file-ignores]
# Migrations hold literal DDL/policy SQL built only from constants.
"migrations/**" = ["E501", "S608"]
# Tests use fixed, fake passwords.
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["voice_platform"]
plugins = ["pydantic.mypy"]
